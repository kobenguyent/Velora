name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Verify macOS App Bundle
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift & macOS toolchain
        run: |
          sw_vers
          swift --version

      - name: Run VeloraCore unit tests
        run: swift test --parallel

      - name: Build & verify native Velora.app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/*.sh scripts/*.swift
          ./scripts/build-app.sh \
            --arch native \
            --version "0.0.0-ci" \
            --build "$BUILD_NUMBER" \
            --github-repo "$GITHUB_REPO"

      - name: Upload CI app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Velora-macOS-CI
          path: dist/Velora.app
          retention-days: 7
