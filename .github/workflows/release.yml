name: Release macOS App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or 1.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build Universal macOS App & Publish GitHub Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version & tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_VERSION="$INPUT_VERSION"
            VERSION="${RAW_VERSION#v}"
            TAG="v${VERSION}"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer 2.0.0 version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG version=$VERSION prerelease=$PRERELEASE"

      - name: Run unit test suite
        run: swift test --parallel

      - name: Import Apple Developer signing certificate (optional)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "No Apple Developer signing secrets configured; proceeding with ad-hoc signing."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/velora-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build universal binary & package release artifacts (.dmg, .zip, SHA256SUMS)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/*.sh scripts/*.swift
          ./scripts/package-release.sh \
            --arch universal \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --github-repo "$GITHUB_REPO"

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -c 'import os, sys; sys.stdout.write(sys.stdin.read().replace("__VERSION__", os.environ["VERSION"]))' <<'EOF' > dist/RELEASE_NOTES.md
          ## Velora v__VERSION__ for macOS (Apple Silicon & Intel Universal)

          ### Artifacts
          - **`Velora-__VERSION__-macos-universal.dmg`** — Drag-to-Applications installer for first-time installation
          - **`Velora-__VERSION__-macos-universal.zip`** — Archive used automatically by Velora's in-app GitHub Releases auto-updater
          - **`SHA256SUMS.txt`** — SHA-256 checksums verified automatically before installing updates

          ### Installing Without a Paid Apple Developer ID (First Launch)
          Because community builds are ad-hoc signed, macOS Gatekeeper may flag the first launch of a downloaded app. After dragging **Velora.app** to `/Applications`, run once in Terminal:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Velora.app
          ```

          Or go to **System Settings → Privacy & Security** and click **Open Anyway**.
          Subsequent in-app updates handle quarantine removal and relaunch automatically!

          ### Requirements
          - macOS 14.0 (Sonoma) or later (Apple Silicon or Intel)
          - `yt-dlp` & `ffmpeg` — installable directly in one click from Velora's **Engine Setup** screen (or `brew install yt-dlp ffmpeg`)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Velora v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/Velora-${{ steps.meta.outputs.version }}-macos-universal.dmg
            dist/Velora-${{ steps.meta.outputs.version }}-macos-universal.zip
            dist/SHA256SUMS.txt

      - name: Clean up signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/velora-signing.keychain-db"
